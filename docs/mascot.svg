<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" width="440" height="300" role="img" aria-label="skill-clash mascot: two identical blob creatures shouting the same speech bubble at each other, with a spark between them">
  <title>skill-clash</title>

  <defs>
    <!-- soft drop shadow, subtle enough for light and dark backgrounds -->
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="coral" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a7a"/>
      <stop offset="1" stop-color="#ef5d52"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc861"/>
      <stop offset="1" stop-color="#f0a02c"/>
    </linearGradient>
  </defs>

  <!-- ============ LEFT TWIN ============ -->
  <g filter="url(#soft)">
    <!-- speech bubble: identical content to the right twin -->
    <g transform="translate(26,18) rotate(-6 80 46)">
      <rect x="0" y="0" width="160" height="82" rx="20" fill="url(#coral)"/>
      <path d="M118 80 L136 108 L142 78 Z" fill="#ef5d52"/>
      <rect x="22" y="24" width="86" height="9" rx="4.5" fill="#fff" opacity=".92"/>
      <rect x="22" y="46" width="116" height="9" rx="4.5" fill="#fff" opacity=".62"/>
    </g>

    <!-- body, leaning right into the clash -->
    <g transform="translate(34,150) rotate(7 62 60)">
      <ellipse cx="40" cy="116" rx="17" ry="8" fill="#ef5d52" opacity=".55"/>
      <ellipse cx="84" cy="116" rx="17" ry="8" fill="#ef5d52" opacity=".55"/>
      <rect x="8" y="10" width="108" height="104" rx="40" fill="url(#coral)"/>
      <!-- face -->
      <ellipse cx="44" cy="58" rx="13" ry="14" fill="#fff"/>
      <ellipse cx="82" cy="58" rx="13" ry="14" fill="#fff"/>
      <circle cx="48" cy="60" r="6.5" fill="#33323c"/>
      <circle cx="86" cy="60" r="6.5" fill="#33323c"/>
      <circle cx="50.5" cy="57.5" r="2.2" fill="#fff"/>
      <circle cx="88.5" cy="57.5" r="2.2" fill="#fff"/>
      <!-- determined little brows -->
      <rect x="32" y="38" width="20" height="5" rx="2.5" fill="#c9443b" transform="rotate(12 42 40)"/>
      <rect x="76" y="38" width="20" height="5" rx="2.5" fill="#c9443b" transform="rotate(-12 86 40)"/>
      <!-- open "hey that's mine" mouth -->
      <ellipse cx="64" cy="86" rx="10" ry="12" fill="#8f2f28"/>
      <ellipse cx="64" cy="92" rx="6" ry="5" fill="#ff9d94"/>
    </g>
  </g>

  <!-- ============ RIGHT TWIN (same creature, mirrored) ============ -->
  <g filter="url(#soft)">
    <g transform="translate(254,18) rotate(6 80 46)">
      <rect x="0" y="0" width="160" height="82" rx="20" fill="url(#amber)"/>
      <path d="M42 80 L24 108 L18 78 Z" fill="#f0a02c"/>
      <rect x="52" y="24" width="86" height="9" rx="4.5" fill="#fff" opacity=".92"/>
      <rect x="22" y="46" width="116" height="9" rx="4.5" fill="#fff" opacity=".62"/>
    </g>

    <g transform="translate(286,150) rotate(-7 62 60)">
      <ellipse cx="40" cy="116" rx="17" ry="8" fill="#f0a02c" opacity=".55"/>
      <ellipse cx="84" cy="116" rx="17" ry="8" fill="#f0a02c" opacity=".55"/>
      <rect x="8" y="10" width="108" height="104" rx="40" fill="url(#amber)"/>
      <ellipse cx="42" cy="58" rx="13" ry="14" fill="#fff"/>
      <ellipse cx="80" cy="58" rx="13" ry="14" fill="#fff"/>
      <circle cx="38" cy="60" r="6.5" fill="#33323c"/>
      <circle cx="76" cy="60" r="6.5" fill="#33323c"/>
      <circle cx="40.5" cy="57.5" r="2.2" fill="#fff"/>
      <circle cx="78.5" cy="57.5" r="2.2" fill="#fff"/>
      <rect x="28" y="38" width="20" height="5" rx="2.5" fill="#c07714" transform="rotate(-12 38 40)"/>
      <rect x="72" y="38" width="20" height="5" rx="2.5" fill="#c07714" transform="rotate(12 82 40)"/>
      <ellipse cx="60" cy="86" rx="10" ry="12" fill="#8a5a0c"/>
      <ellipse cx="60" cy="92" rx="6" ry="5" fill="#ffd28f"/>
    </g>
  </g>

  <!-- ============ THE CLASH ============ -->
  <g transform="translate(220,148)">
    <!-- impact burst -->
    <path d="M0 -46 L11 -15 L42 -24 L20 -1 L45 16 L14 13 L18 46 L0 20 L-17 46 L-14 13 L-45 16 L-20 -1 L-42 -24 L-11 -15 Z"
          fill="#fff3c4" stroke="#f0a02c" stroke-width="3" stroke-linejoin="round"/>
    <!-- lightning bolt -->
    <path d="M6 -26 L-13 2 L-1 2 L-6 26 L13 -3 L1 -3 Z" fill="#ef5d52"/>
  </g>

  <!-- little motion ticks, so it reads as a collision not a decoration -->
  <g stroke="#f0a02c" stroke-width="4" stroke-linecap="round" opacity=".85">
    <line x1="176" y1="106" x2="162" y2="96"/>
    <line x1="264" y1="106" x2="278" y2="96"/>
    <line x1="182" y1="196" x2="166" y2="204"/>
    <line x1="258" y1="196" x2="274" y2="204"/>
  </g>
</svg>
