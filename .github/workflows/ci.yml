name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Path handling, symlinks and the `claude` spawn all differ per platform,
    # so the matrix is the point of this workflow, not a formality.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test the built binary
        shell: bash
        run: |
          node dist/cli.js --version
          # Exit 1 is expected here: the fixtures contain a real clash.
          node dist/cli.js --home fixtures/home --cwd fixtures/project || [ $? -eq 1 ]
          node dist/cli.js --home fixtures/home --cwd fixtures/project --json | node -e "
            let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
              const r=JSON.parse(s);
              if(!r.clashes.length) { console.error('expected clashes in fixtures'); process.exit(1); }
              console.log('ok:', r.scanned, 'skills,', r.clashes.length, 'pairs');
            })"
          node dist/cli.js --home fixtures/home --cwd fixtures/project --explain impeccable web-design
          # A missing skill must be a usage error, not a crash.
          node dist/cli.js --explain nope alsonope; [ $? -eq 2 ]

      - name: Verify the published tarball installs and runs
        shell: bash
        run: |
          npm pack
          mkdir -p "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/skill-clash-*.tgz
          ./node_modules/.bin/skill-clash --version
          # No skills on a CI box: must exit 0 and say so, not crash.
          ./node_modules/.bin/skill-clash --home "$RUNNER_TEMP/empty" --cwd "$RUNNER_TEMP/empty"
